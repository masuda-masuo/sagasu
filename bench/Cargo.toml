[package]
name = "bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark harness for sagasu — reproducible performance measurement"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
