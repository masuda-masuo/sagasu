name: prototypes

# CI for prototypes/ (see prototypes/README.md). Two jobs:
#   - check: cheap correctness gate -- workspace compiles and clippy is clean, on both
#     Linux (mirrors the VM benchmark environment) and Windows.
#   - release-windows: on a tag push (or manual dispatch) builds all three prototype
#     binaries natively on a Windows runner against x86_64-pc-windows-msvc and attaches
#     them to the matching GitHub Release. This replaces the hand-built mingw
#     cross-compile that used to produce the published .exe assets (issue #10).

on:
  push:
    branches: [main]
    tags: ["proto-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          GitHub Release tag (e.g. proto-20260727) to attach the built Windows
          binaries to. Leave empty to just build without publishing (dry run) --
          the binaries are still uploaded as a workflow artifact either way.
        required: false
        default: ""

# Default for jobs that do not declare their own: check only builds and tests
# (CodeQL actions/missing-workflow-permissions). release-windows declares
# `contents: write` for itself, and a job-level block replaces this one
# entirely, so attaching binaries to a Release is unaffected.
permissions:
  contents: read

jobs:
  check:
    name: check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "prototypes -> target"

      - name: cargo build --release
        working-directory: prototypes
        run: cargo build --release

      - name: cargo clippy -D warnings
        working-directory: prototypes
        run: cargo clippy --all-targets -- -D warnings

  release-windows:
    name: build & publish Windows binaries (MSVC)
    needs: check
    if: startsWith(github.ref, 'refs/tags/proto-') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "prototypes -> target"

      # Native build on a Windows runner against the MSVC target: no cross-compiler,
      # no mingw, just the toolchain a windows-latest runner already ships with. The
      # version resource / manifest embedding in each crate's build.rs uses this same
      # toolchain's rc.exe automatically (see prototypes/build-common.rs).
      - name: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: prototypes
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage binaries
        shell: bash
        working-directory: prototypes
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/proto-crawl.exe dist/
          cp target/x86_64-pc-windows-msvc/release/proto-fulltext.exe dist/
          cp target/x86_64-pc-windows-msvc/release/proto-usn.exe dist/

      # tag は env 経由で bash に渡す: ${{ }} を run に直書きすると、テンプレート展開が
      # シェル解釈より先に走るため、細工した dispatch 入力が $GITHUB_OUTPUT へ行を
      # 注入できてしまう。env 変数化すれば値はただのデータになる。
      # 注意: `dispatch && inputs.tag || ref_name` の一発式にはしない — dispatchで
      # tag空(dry run)のとき falsy 連鎖で ref_name(=ブランチ名)に落ち、dry runの
      # つもりが「main」というリリースへ添付しに行く。
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: prototypes-windows-msvc
          path: prototypes/dist/*.exe

      - name: Attach to GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: prototypes/dist/*.exe
          fail_on_unmatched_files: true
