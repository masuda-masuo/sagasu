name: sagasu

# CI for the production sagasu workspace (crates/sagasu-core, crates/sagasu-cli).
# Runs `cargo test --workspace` on ubuntu and windows-latest.
# The ubuntu job provides the Linux integration-test coverage; the windows job
# is a compile gate for any `#[cfg(windows)]` branches (M0: fs_id stays NULL).

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/sagasu-core/**"
      - "crates/sagasu-cli/**"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/sagasu-core/**"
      - "crates/sagasu-cli/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: cargo test --workspace
        run: cargo test --workspace

  # The `office` / `pdf` / `exif` features are on by default, so the default job
  # above never builds the code path where they are off — the one that has to
  # keep degrading to `unsupported format` instead of failing to compile
  # (issue #40). Tests, not just a build: the degradation is asserted in
  # `fulltext_tests`, and a compile check would not run those assertions.
  no-default-features:
    name: no-default-features / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: cargo test -p sagasu-core --no-default-features
        run: cargo test -p sagasu-core --no-default-features
