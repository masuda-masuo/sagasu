[workspace]
resolver = "2"
members = ["proto-crawl", "proto-fulltext", "proto-usn", "proto-gui-core", "proto-gui"]
default-members = ["proto-crawl", "proto-fulltext", "proto-usn", "proto-gui-core"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "thin"
