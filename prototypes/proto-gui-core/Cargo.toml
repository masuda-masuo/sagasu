[package]
name = "proto-gui-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
ignore = "0.4"
tantivy = "0.26"
lindera = "5"
lindera-tantivy = { version = "5.0", features = ["embed-ipadic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
tempfile = "3"
