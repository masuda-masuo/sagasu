[package]
name = "proto-ftcompare"
version = "0.1.0"
edition = "2021"
description = "Throwaway prototype: tantivy vs SQLite FTS5 head-to-head (issue #35)"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
ignore = "0.4"
tantivy = "0.26"
lindera = "5"
lindera-tantivy = { version = "5.0", features = ["embed-ipadic"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
