[workspace]
resolver = "2"
members = ["crates/sagasu-core", "crates/sagasu-cli"]
exclude = ["prototypes", "bench"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
tantivy = "0.25"
lindera = "4"
lindera-tantivy = { version = "4.0", features = ["embed-ipadic"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
lto = "thin"
