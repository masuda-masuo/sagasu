[workspace]
resolver = "2"
members = ["crates/sagasu-core", "crates/sagasu-cli"]
exclude = ["prototypes", "bench"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ignore = "0.4"
# Glob matching for the user-defined tag rules (docs/tag_rules.md). Already in
# the tree as a dependency of `ignore`, so declaring it directly costs no extra
# compilation.
globset = "0.4"
# Config format for the tag rule file. TOML is what `bench/configs/*.toml`
# already uses, so the project has one config language rather than two.
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The machine-readable CLI rendering (`--json`, issue #6, docs/cli.md §4).
# Hand-rolling the encoder would mean hand-rolling the escaping, and the one
# place a search tool must not corrupt its output is a path with a quote in it.
# CLI-only: `sagasu-core` does not depend on it, because the JSON is a rendering
# of the CLI's output and not a second contract on the core types.
serde_json = "1"
# ── Embedded document formats (issue #40) ────────────────────────────────────
# OOXML (docx/xlsx/pptx) is a ZIP of XML parts, so the container and the parser
# are two small crates rather than one library per format.
#
# `deflate-flate2-zlib-rs` is `deflate` (the feature a reader needs) minus
# `zopfli`: zopfli is a *compressor* tuned for maximum ratio at glacial speed,
# which an indexer never runs. That was the open question left on issue #40's
# dependency comparison — the answer is one crate lighter than the estimate.
# Plain `deflate-flate2` is not enough: it pulls flate2 with no backend
# selected, which only builds by accident when another dependency happens to
# choose one (it does not, in the `--no-default-features` build).
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
quick-xml = "0.41"
# PDF. `default-features = false` is load-bearing: the default set pulls three
# date/time libraries (chrono / jiff / time) and rayon, none of which text
# extraction touches. Checked with `cargo tree -p sagasu-core --edges normal`.
lopdf = { version = "0.44", default-features = false }
kamadak-exif = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
tantivy = "0.25"
lindera = "4"
lindera-tantivy = { version = "4.0", features = ["embed-ipadic"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
lto = "thin"
