[workspace]
resolver = "2"
members = ["crates/sagasu-core", "crates/sagasu-cli"]
exclude = ["prototypes", "bench"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"

[profile.release]
lto = "thin"
